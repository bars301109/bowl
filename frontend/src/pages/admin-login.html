<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход администратора</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/images/лого.png">
  <style>
    body {
      background: var(--paper) !important;
      color: var(--ink) !important;
      font-family: var(--font-body), 'Onest', sans-serif !important;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    .auth-card {
      background: var(--surface);
      border-radius: var(--r-lg);
      border: 1px solid var(--line);
      padding: 38px 36px 32px;
      width: 100%;
      box-shadow: 0 16px 36px rgba(29, 27, 24, 0.08);
      transition: border-color 0.15s ease;
    }
    .auth-card:hover {
      border-color: var(--ink);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header img {
      height: 48px;
      margin-bottom: 14px;
      width: auto;
      object-fit: contain;
    }
    .auth-header h1 {
      font-family: var(--font-display), 'Spectral', Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink);
      letter-spacing: -0.015em;
    }
    .auth-header p {
      color: var(--ink-3);
      font-size: 14px;
      margin: 0;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--ink-2);
      font-size: 13.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      font-family: var(--font-body), sans-serif;
      font-size: 14.5px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(29, 27, 24, 0.08);
    }
    .submit-btn {
      width: 100%;
      min-height: 48px;
      padding: 12px 24px;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      border-radius: var(--r-sm);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      margin-top: 8px;
    }
    .submit-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    .error {
      color: var(--err);
      background: var(--err-wash);
      border: 1px solid var(--err);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-size: 13.5px;
      margin-top: 14px;
      text-align: center;
    }
    .success {
      color: var(--ok);
      background: var(--ok-wash);
      border: 1px solid var(--ok);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-size: 13.5px;
      margin-top: 14px;
      text-align: center;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft);
    }
    .back-link a {
      color: var(--ink-3);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .back-link a:hover {
      color: var(--ink);
      text-decoration: underline;
    }
  </style>
  <link rel="icon" type="image/png" href="/images/лого.png">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/images/лого.png" alt="Logo">
        <h1>Администратор</h1>
        <p>Вход в панель управления турниром</p>
      </div>
      
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="username">Логин администратора</label>
          <input type="text" id="username" name="username" required autofocus placeholder="Логин">
        </div>
        
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" required placeholder="Пароль">
        </div>
        
        <button type="submit" class="submit-btn">Войти в панель</button>
        
        <div id="message"></div>
      </form>
      
      <div class="back-link">
        <a href="/">← Вернуться на главную страницу</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = (document.getElementById('username').value || '').trim();
      const password = document.getElementById('password').value || '';
      const messageDiv = document.getElementById('message');
      
      messageDiv.className = '';
      messageDiv.textContent = 'Проверка...';
      
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          messageDiv.className = 'error';
          messageDiv.textContent = data.error || 'Неверный логин или пароль';
          document.getElementById('password').value = '';
          return;
        }

        if (data.token) {
          localStorage.setItem('adminToken', data.token);
          try {
            document.cookie = `admin_token=${encodeURIComponent(data.token)}; path=/; max-age=1209600; SameSite=None; Secure`;
          } catch {}
        }
        messageDiv.className = 'success';
        messageDiv.textContent = 'Вход успешен...';
        setTimeout(() => {
          window.location.replace('/admin');
        }, 300);
      } catch (err) {
        messageDiv.className = 'error';
        messageDiv.textContent = 'Ошибка сети. Попробуйте позже.';
      }
    });
  </script>
</body>
</html>
